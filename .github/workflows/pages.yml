# 驗證並部署靜態檔案至 GitHub Pages。
name: 部署小樽全區導覽至 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 取得專案原始碼
        uses: actions/checkout@v6
      - name: 準備 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 驗證程式與資料
        run: npm run check
      - name: 準備 Pages 靜態檔案
        run: |
          mkdir -p _site
          cp -R index.html assets src data .nojekyll _site/
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

